name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  manifests:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate marketplace.json and plugin.json
        run: |
          set -euo pipefail

          marketplace=".claude-plugin/marketplace.json"
          plugin="plugins/crow-mind-workflow/.claude-plugin/plugin.json"

          # Assert both files parse as JSON.
          for f in "$marketplace" "$plugin"; do
            if ! jq empty "$f" >/dev/null 2>&1; then
              echo "::error file=$f::not valid JSON"
              exit 1
            fi
          done

          # Assert every required field is present, non-null, and non-empty.
          assert_field() {
            local file="$1" path="$2" value
            value="$(jq -r "$path // \"__MISSING__\"" "$file")"
            if [ "$value" = "__MISSING__" ] || [ -z "$value" ]; then
              echo "::error file=$file::missing or empty required field $path"
              exit 1
            fi
          }

          assert_field "$marketplace" ".name"
          assert_field "$marketplace" ".owner.name"
          assert_field "$marketplace" ".plugins[0].name"
          assert_field "$marketplace" ".plugins[0].source"
          assert_field "$marketplace" ".plugins[0].version"

          assert_field "$plugin" ".name"
          assert_field "$plugin" ".version"

          # Enforce the version-parity invariant the README declares:
          # the marketplace plugin entry and plugin.json must be bumped together.
          mv=$(jq -r '.plugins[0].version' "$marketplace")
          pv=$(jq -r '.version' "$plugin")
          [ "$mv" = "$pv" ] || { echo "::error::version drift: marketplace=$mv plugin=$pv"; exit 1; }

          echo "Manifests valid (versions in sync: $pv)."
          echo "Note: 'claude plugin validate .' is the authoritative local check."
